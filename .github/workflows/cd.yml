name: Déploiement continu

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruire chaque semaine pour récupérer les correctifs de l'image de base (nginx).
  schedule:
    - cron: "0 5 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: cmnemoi/site

# Un déploiement à la fois : deux `docker compose up` simultanés se gênent en recréant les conteneurs.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Construire l'image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=main

      - uses: docker/build-push-action@v6
        with:
          pull: true
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Déployer sur le serveur
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Calculer le tag de l'image
        id: image-tag
        run: echo "value=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Copier le fichier compose sur le serveur
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "compose.prod.yaml"
          target: "~/www"

      - name: Déployer
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
        with:
          envs: IMAGE_TAG
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd ~/www
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d --remove-orphans
            docker image prune -f
